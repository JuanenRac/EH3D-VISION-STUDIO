name: Count the tests

on:
  push:
    branches: [tmp-count]

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-VISION-STUDIO
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-VISION-STUDIO
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: EH3D-VISION-STUDIO
      - name: Libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Count the tests of cargo test --workspace
        run: |
          cargo test --workspace 2>&1 | tee /tmp/t.log || true
          awk '/test result: ok/ {s += $4} END {print "TESTCOUNT=" s}' /tmp/t.log
        working-directory: EH3D-VISION-STUDIO
