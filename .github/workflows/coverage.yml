name: EH3D Coverage

on:
  push:
    branches: ["cov-before/**"]
    paths-ignore:
      - "**.md"
      - "images/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the measured line coverage of the tests; it may be raised when the tests grow and never set above what is measured
  COVERAGE_FLOOR: "0"
  # The tag of each sibling repository this one is built against (name=tag, separated by spaces); a sibling that is not listed is taken at main.
  SIBLING_REFS: "EH3D-COMMON=v0.2.0"

jobs:
  rust:
    name: Coverage of the tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-VISION-STUDIO
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-VISION-STUDIO
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: EH3D-VISION-STUDIO
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.16
      - name: Measure
        working-directory: EH3D-VISION-STUDIO
        run: |
          cargo llvm-cov --all-targets --no-report
          cargo llvm-cov report --summary-only | tee summary.txt
          cargo llvm-cov report --show-missing-lines | tee missing.txt | tail -n 120
      - name: Line coverage stays at or above the floor
        working-directory: EH3D-VISION-STUDIO
        run: |
          lines=$(awk '/^TOTAL/ {gsub("%","",$10); print $10}' summary.txt)
          echo "measured line coverage: ${lines}"
          awk -v m="$lines" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(m + 0 >= f + 0) }'
