<title id="t">EH3D-VISION-STUDIO architecture</title>
<desc id="d">EH3D-VISION-STUDIO is a Rust library and command line that find round fiducial marks in a picture and work out the turn and the shift that put a board where its design says. It has no live camera yet.</desc>
