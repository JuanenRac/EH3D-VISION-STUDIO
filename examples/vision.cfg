# The values of the window and of the program (EH3D-VISION-STUDIO). Put this file beside the program or in the folder where it is started, as vision.cfg,
# or name another file in the variable EH3D_VISION_CONFIG. A value that is not written keeps the one shown here.

# the language of the window: auto (the one of the system), en, es, de, fr, it, ja, zh or pt
language = auto

# the marks: dark on a light board (dark) or light on a dark board (light)
polarity = dark

# the grey level that separates the marks from the board, 0 to 255, or auto (the threshold of Otsu is worked out from the picture)
threshold = auto

# the range of the diameter of a mark, in pixels
min_diameter = 8
max_diameter = 200

# how much of its circle a mark fills (0 to 1) and how much longer than wide it may be (1 is a circle)
min_fill = 0.85
max_elongation = 1.25

# the size in millimetres of the mark that sets the scale of the camera
known_mm = 1

# the target with the marks in rows and columns that measures the distortion of the lens
grid_columns = 5
grid_rows = 4

# whether the alignment may change the size of the board (yes or no)
allow_scale = no

# the alignment is accepted when the marks fit the design to this many millimetres, and the board is not stretched more than this (0.01 is one percent)
max_rms = 0.1
max_stretch = 0.01

# the largest picture or file of points that is opened, in MiB (1 to 1024)
max_file_mib = 64
