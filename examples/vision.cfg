# The values of the window and of the program (EH3D-VISION-STUDIO). Put this file beside the program or in the folder where it is started, as vision.cfg,
# or name another file in the variable EH3D_VISION_CONFIG. A value that is not written keeps the one shown here.

# the language of the window: auto (the one of the system), en, es, de, fr, it, ja, zh or pt
language = auto

# the marks: dark on a light board (dark) or light on a dark board (light)
polarity = dark

# the grey level that separates the marks from the board, 0 to 255, or auto (the threshold of Otsu is worked out from the picture)
threshold = auto

# the range of the diameter of a mark, in pixels
min_diameter = 8
max_diameter = 200

# how much of its circle a mark fills (0 to 1) and how much longer than wide it may be (1 is a circle)
min_fill = 0.85
max_elongation = 1.25

# the size in millimetres of the mark that sets the scale of the camera
known_mm = 1

# the target with the marks in rows and columns that measures the distortion of the lens
grid_columns = 5
grid_rows = 4

# whether the alignment may change the size of the board (yes or no)
allow_scale = no

# the alignment is accepted when the marks fit the design to this many millimetres, and the board is not stretched more than this (0.01 is one percent)
max_rms = 0.1
max_stretch = 0.01

# the largest picture or file of points that is opened, in MiB (1 to 1024)
max_file_mib = 64

# whether the window draws, for each mark of an alignment, a line from the place the design puts it to the mark that was found, with the distance in millimetres (yes or no)
show_residuals = yes

# whether `find` works the centre of each mark out again from the grey levels around it (to a fraction of a pixel) and prints a confidence (yes or no)
refine_subpixel = no

# the contrast (0 to 1, 1 is black against white) from which the confidence of a mark is the score of its shape alone; a mark that stands out less is trusted less
full_contrast = 0.3

# the side in pixels of the window over which the light is averaged to take uneven light (a lamp that fades, a shadow) out of the picture before the marks are searched for: about three times the largest mark, 3 to 4001, or 0 to leave the picture as it is
flatten_window = 0

# the millimetres of a pixel of the camera (the command calibrate works it out from a target); 0 means that it is not known, and measure then needs --mm-per-px
mm_per_px = 0

# a spot counts as a part (measure) when it has from part_min_area to part_max_area pixels, and a picture with more than max_parts of them is refused (1 to 100000)
part_min_area = 100
part_max_area = 50000000
max_parts = 1000

# the cross-shaped marks (crosses): the range of the side of the box that holds a cross, in pixels (7 up), and how much longer than wide that box may be (1 is a square)
cross_min_size = 12
cross_max_size = 200
cross_max_elongation = 1.2

# calibrate: how much the distances between neighbouring marks of the target may differ (0.05 is five percent) for the scale from their pitch to be given; more means a target not seen square-on or a lens that bends it
pitch_tolerance = 0.05

# batch: the most pictures read from a folder; a folder with more is refused (1 to 100000)
batch_max_files = 500

# squares and crosses turned by any angle: the least share of its box that a square fills (a disc fills about 0.785), and the least score of a cross; raise them to be stricter (0 to 1, above 0)
square_min_fill = 0.88
cross_min_score = 0.85

# the square marks (squares): the range of the side of the square, in pixels (7 up), and how much longer than wide its box may be (1 is a square); the crosses have their own range above
square_min_size = 12
square_max_size = 200
square_max_elongation = 1.2

# the lens: the two radial factors that `eh3d-vision lens` works out from a grid of marks (0 and 0 leave the lens as it is; each between -0.5 and 0.5), and the most the marks of the grid may be from their lattice once corrected, in pixels (the fit is refused above it)
lens_k1 = 0
lens_k2 = 0
lens_max_rms = 0.5

# inspect: the file with the table of packages (package, body_long_mm, body_short_mm and, if wanted, tolerance_mm; empty means that --table has to be given), the most a part may differ from the body of its package in length or in width in millimetres, and the most it may be turned from the x axis in degrees (0 is not checked)
package_table =
inspect_tolerance = 0.2
inspect_max_angle = 0

# batch --html: the score below which a picture gets a warning in the HTML report (0 to 1)
report_low_score = 0.6

# calibrate: the distance in millimetres between neighbouring marks of the target (0 means that it is not known, and calibrate then needs --pitch-mm)
pitch_mm = 0

# the files that are written (the window's parts and folder report, and the command line without --replace): yes lets them be written over a file that is there; no (the default) refuses
replace_output = no

# shots: the share of the field by which neighbouring pictures of the plan overlap (0 to 0.9), and the margin around the part that the pictures must cover, in millimetres
shots_overlap = 0.1
shots_margin = 0.5
