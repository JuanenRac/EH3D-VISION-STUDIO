# The values of the window and of the program (EH3D-VISION-STUDIO). Put this file beside the program or in the folder where it is started, as vision.cfg,
# or name another file in the variable EH3D_VISION_CONFIG. A value that is not written keeps the one shown here.

# the language of the window: auto (the one of the system), en, es, de, fr, it, ja, zh or pt
language = auto

# the marks: dark on a light board (dark) or light on a dark board (light)
polarity = dark

# the grey level that separates the marks from the board, 0 to 255, or auto (the threshold of Otsu is worked out from the picture)
threshold = auto

# the range of the diameter of a mark, in pixels
min_diameter = 8
max_diameter = 200

# how much of its circle a mark fills (0 to 1) and how much longer than wide it may be (1 is a circle)
min_fill = 0.85
max_elongation = 1.25

# the size in millimetres of the mark that sets the scale of the camera
known_mm = 1

# the target with the marks in rows and columns that measures the distortion of the lens
grid_columns = 5
grid_rows = 4

# whether the alignment may change the size of the board (yes or no)
allow_scale = no

# the alignment is accepted when the marks fit the design to this many millimetres, and the board is not stretched more than this (0.01 is one percent)
max_rms = 0.1
max_stretch = 0.01

# the largest picture or file of points that is opened, in MiB (1 to 1024)
max_file_mib = 64

# whether the window draws, for each mark of an alignment, a line from the place the design puts it to the mark that was found, with the distance in millimetres (yes or no)
show_residuals = yes

# whether `find` works the centre of each mark out again from the grey levels around it (to a fraction of a pixel) and prints a confidence (yes or no)
refine_subpixel = no

# the contrast (0 to 1, 1 is black against white) from which the confidence of a mark is the score of its shape alone; a mark that stands out less is trusted less
full_contrast = 0.3

# the side in pixels of the window over which the light is averaged to take uneven light (a lamp that fades, a shadow) out of the picture before the marks are searched for: about three times the largest mark, 3 to 4001, or 0 to leave the picture as it is
flatten_window = 0

# the millimetres of a pixel of the camera (the command calibrate works it out from a target); 0 means that it is not known, and measure then needs --mm-per-px
mm_per_px = 0

# a spot counts as a part (measure) when it has from part_min_area to part_max_area pixels, and a picture with more than max_parts of them is refused (1 to 100000)
part_min_area = 100
part_max_area = 50000000
max_parts = 1000

# the cross-shaped marks (crosses): the range of the side of the box that holds a cross, in pixels (7 up), and how much longer than wide that box may be (1 is a square)
cross_min_size = 12
cross_max_size = 200
cross_max_elongation = 1.2

# calibrate: how much the distances between neighbouring marks of the target may differ (0.05 is five percent) for the scale from their pitch to be given; more means a target not seen square-on or a lens that bends it
pitch_tolerance = 0.05

# batch: the most pictures read from a folder; a folder with more is refused (1 to 100000)
batch_max_files = 500

# squares and crosses turned by any angle: the least share of its box that a square fills (a disc fills about 0.785), and the least score of a cross; raise them to be stricter (0 to 1, above 0)
square_min_fill = 0.88
cross_min_score = 0.85

# the square marks (squares): the range of the side of the square, in pixels (7 up), and how much longer than wide its box may be (1 is a square); the crosses have their own range above
square_min_size = 12
square_max_size = 200
square_max_elongation = 1.2

# the lens: the two radial factors that `eh3d-vision lens` works out from a grid of marks (0 and 0 leave the lens as it is; each between -0.5 and 0.5), and the most the marks of the grid may be from their lattice once corrected, in pixels (the fit is refused above it)
lens_k1 = 0
lens_k2 = 0
lens_max_rms = 0.5
# the window: yes draws, once the lens is fitted from a grid, the places where the fitted lens puts the lattice of the grid, to be compared with the marks that were found
show_lens_grid = yes

# inspect: the file with the table of packages (package, body_long_mm, body_short_mm and, if wanted, tolerance_mm; empty means that --table has to be given), the most a part may differ from the body of its package in length or in width in millimetres, and the most it may be turned from the x axis in degrees (0 is not checked)
package_table =
# inspect: the package of the table that the parts are judged against when --package is not given (empty means that it has to be given)
inspect_package =
inspect_tolerance = 0.2
inspect_max_angle = 0

# batch --html: the score below which a picture gets a warning in the HTML report (0 to 1)
report_low_score = 0.6

# calibrate: the distance in millimetres between neighbouring marks of the target (0 means that it is not known, and calibrate then needs --pitch-mm)
pitch_mm = 0

# the files that are written (the window's parts and folder report, and the command line without --replace): yes lets them be written over a file that is there; no (the default) refuses
replace_output = no

# shots: the share of the field by which neighbouring pictures of the plan overlap (0 to 0.9), and the margin around the part that the pictures must cover, in millimetres
shots_overlap = 0.1
shots_margin = 0.5

# shots: the size of the part in millimetres (0 and 0: the body of the package of the table is used); the window plans the pictures for it, and the command line when neither --package nor --body-long and --body-short are given
shots_part_width = 0
shots_part_height = 0

# the ring marks (rings): the range of the outer diameter in pixels (8 up), the range of the inner diameter over the outer one (above 0, below 1: a thin ring is near 1), the least share of its band that a ring fills, and how much longer than wide it may be (1 is a circle)
ring_min_diameter = 12
ring_max_diameter = 200
ring_min_ratio = 0.25
ring_max_ratio = 0.85
ring_min_fill = 0.85
ring_max_elongation = 1.25

# rings of two sizes: the outer diameter in pixels that tells the small ones from the large ones (0 finds it from the diameters), and how much larger the large ones must be than the small ones (1.25 is a quarter larger, above 1) for two sizes to be told apart when it is 0
ring_split = 0
ring_size_gap = 1.25

# offset: a picked part seen from below. Where the axis of the nozzle is in the picture, in millimetres from the centre of the picture (x to the right, y up); the farthest from it that the part may be held (0 does not check it); the most that it may be turned from the way it should be held, in degrees (0 does not check it, 90 at most). The size of the part is judged with inspect_tolerance against the package inspect_package of the table package_table
nozzle_x_mm = 0
nozzle_y_mm = 0
pick_max_offset_mm = 0
pick_max_turn_deg = 0

# offset: the turn of the long side of the part when it is held as it should be, in degrees counter-clockwise from the x axis; and whether the camera sees the part turned over left to right (a camera that looks up from under the nozzle, or a mirror): the x and the turn of each part change sign (yes or no)
nominal_angle_deg = 0
pick_mirror = no

# picture check: whether a picture is refused before a part is measured from it when it is flat (contrast, the standard deviation of the grey levels, below the least), too dark or too bright (the mean grey level outside the range) or blurred (the sharpness, the variance of the Laplacian, below the least; 0 does not check it, because it depends on the lens and the light). The command quality gives the numbers of a picture (yes or no)
quality_check = no
quality_min_contrast = 10
quality_min_mean = 20
quality_max_mean = 235
quality_min_sharpness = 0

# focus: the sharpness (the variance of the Laplacian) that counts as 50 points of 100 in the result of a focus check that is kept on the server (server send focus); a picture is sharp from there on. It depends on the lens and the light, so it is tuned on a good picture of the machine
focus_reference = 100

# edge: the distance in pixels between two samples along the line that is laid across an edge (0.05 to 1) and the largest uncertainty of the position of the edge, one standard deviation in pixels (more than 0, at most 5), that the command edge accepts. The uncertainty comes from the noise of the two flat grounds at the ends of the line and the slope of the edge, with the rounding of the grey levels added
edge_step_px = 0.25
edge_max_uncertainty_px = 0.25

# server: the EH3D server of the machine, when there is one. The address is host:port (empty means that there is none and nothing is sent), the token is the one of this program (keep this file private), the machine is its id on the server, the timeout is how long one try may take in seconds (1 to 120) and the retries are how many more tries follow a failure on the network (0 to 5). The mdns switch (on or off) says whether the server is looked for on the local network; it is off, and nothing is asked of the network unless it is on and a resolver is linked in. The command server reads the values of this file from the server (the newest artifact vision-MACHINE.cfg) and keeps the results of the other commands on it as artifacts
server_address =
server_token =
server_machine =
server_timeout_s = 15
server_retries = 2
server_mdns = off

# correlate: the diameter in pixels of the disc that the search by correlation looks for, and the least correlation (more than 0, at most 1) that counts as a mark
correlate_diameter = 20
correlate_min_score = 0.8

# train: a mark that is none of the known shapes is trained from rectangles cut around it. The sides of an example in pixels (4 up to 256), its least contrast (0 to 255), the least correlation of each example with the first one, the most that the mark may look like itself moved a few pixels (less than 1), the least score of a search with the mark, the step of the turn in degrees (1 to 45) and how far the search turns the mark in each direction (0 does not turn it, 180 is every angle)
train_min_side = 8
train_max_side = 96
train_min_contrast = 20
train_agree_score = 0.8
train_max_ambiguity = 0.9
train_min_score = 0.8
train_turn_step_deg = 5
train_turn_max_deg = 0

# pair: marks paired with the design whatever the turn of the board. How far a mark may lie from where a pairing puts it (millimetres, up to 50), the least marks that must be paired (2 to 24) and the most that the board may be turned (degrees, 0 to 180; a design that looks the same when turned needs a smaller turn to be told apart)
pair_tolerance_mm = 0.5
pair_min_marks = 3
pair_max_turn_deg = 180

# find_server: the answers of the search for the server on the local network (server_mdns) are only candidates for a person to choose. The most that are kept (1 to 64), whether only the addresses of the local network and the names that end in .local are kept, and how many times it asks when nothing useful answers (1 to 5)
find_server_max = 8
find_server_private_only = yes
find_server_tries = 2

# mjpeg: the limits of the reader of a frame of motion JPEG, which never trusts its bytes. The most bytes of a frame (1024 up to 268435456) and the most pixels of its picture (64 up to 25000000)
mjpeg_max_bytes = 16777216
mjpeg_max_pixels = 25000000

# card: the card of calibration to print (eh3d-vision calib-card), in millimetres. The dots along each side (3 to 40), the distance between neighbouring dots (2 to 100), the diameter of a dot (0.3 up to a little under half the pitch), the margin left free around the grid (0 to 50) and the size of the page (50 to 2000); a card that does not fit its page is refused, never drawn smaller
card_columns = 9
card_rows = 7
card_pitch_mm = 10
card_dot_mm = 4
card_margin_mm = 10
card_paper_w_mm = 210
card_paper_h_mm = 297

# light: the check of the light of a picture (eh3d-vision light-check). The zones along a side (2 to 16), the grey level from which a pixel is burnt out (1 to 255), the most burnt-out share (0 to 1), the range that the mean grey level must be in, the most that the zones may differ as a share of their mean (0 to 4), the most that one half may differ from the other as a share of the mean (0 to 2) and the most pixels of a picture (64 up to 25000000)
light_cells = 4
light_saturation_level = 250
light_max_saturated = 0.02
light_min_mean = 40
light_max_mean = 215
light_max_uneven = 0.35
light_max_tilt = 0.25
light_max_pixels = 25000000

# tape: the search for the holes of a tape of parts (eh3d-vision tape-locate). The hole and the pitch of a tape in millimetres, how far the pitch measured and a hole off the line may be (millimetres), how far the size of a hole may be from its size (a share, 0 to 1), the holes it needs (2 up) and accepts (up to 10000), the pitch of the pockets and where the first is from a hole, along the tape and across it (positive to the right of the way the tape goes), and the most pixels of a picture
tape_hole_mm = 1.5
tape_pitch_mm = 4
tape_tolerance_mm = 0.1
tape_line_tolerance_mm = 0.15
tape_size_tolerance = 0.25
tape_min_holes = 4
tape_max_holes = 400
tape_pocket_pitch_mm = 4
tape_pocket_along_mm = 2
tape_pocket_across_mm = 3.5
tape_max_pixels = 25000000

# rectify: the largest side in pixels of the picture that is made from the four corners of a rectangle
rectify_max_side = 4096

# pads: how much the pitch of a row of pads may vary, and how far a pad may lie from the row against the pitch, as a share of the median pitch (more than 0, at most 1)
pads_tolerance = 0.05

# diff: how much a grey level has to differ (0 to 254) for a pixel to count as changed, the fewest pixels of a region of changes, and the largest share of changed pixels (0 to 1) for two pictures to count as the same
diff_threshold = 25
diff_min_area = 4
diff_max_changed = 0.01

# orientation: which way a part with a mark on it (the band of a diode, the dot of pin 1) is held. A pixel is the part when it differs from the board by at least the body contrast and is the mark when it differs from the body by at least the mark contrast (grey levels, 1 to 255); a mark has at least the least pixels (1 or more); the mark may point at most the tolerance in degrees (0 to 90) from the direction that is asked for, or from a quarter of a turn when none is
orientation_body_contrast = 30
orientation_mark_contrast = 40
orientation_min_mark_px = 4
orientation_tolerance_deg = 10

# footprint: how far the length and the width of each pad may be from the design, in millimetres (more than 0)
footprint_tolerance_mm = 0.05

# sharpmap: the cells on each side of the map of sharpness (2 to 64), the share of the median sharpness (more than 0, at most 1) below which a cell is weak, and the contrast (grey levels, 0 to 255) below which a cell is empty and is not judged
sharpmap_cells = 8
sharpmap_min_share = 0.5
sharpmap_min_contrast = 3

# board: the side of a square of the board in millimetres (0: not known; the distance between the centres of neighbours is pitch_mm), how far the scales along x and along y may differ (more than 0, at most 1) and how much the distances between neighbours may differ
board_square_mm = 0
board_max_aspect = 0.02
board_max_spread = 0.05

# capture: the live camera. The backend (auto, sim, v4l2, mfoundation or libcamera; the three real ones are built with their own feature and have not been run on a real camera), the camera by its identifier vendor:product:serial@port (empty: the first one), the format as WIDTHxHEIGHT@FPS:PIXEL with the pixel yuyv, mjpeg, rgb24 or gray8 (empty: the biggest usable one at 15 frames a second or more), the settings of the camera as words such as exposure=120 gain=10 focus=auto (empty: the camera as it is), and the level of the log (error, warn, info or debug)
capture_backend = auto
capture_camera =
capture_format =
capture_profile =
capture_log_level = warn

# capture: what one USB bus carries in megabits a second (10 to 100000; a bus of USB 2 carries about 320 in practice) and the bits for each pixel that a motion JPEG stream is counted at (0.5 to 8)
capture_usb_mbps = 320
capture_mjpeg_bits_px = 2

# capture: the mean brightness below which a frame is black (0 to 255), the frames in a row that are exactly the same for the stream to be frozen (2 to 1000), the depth of the flicker of the light above which it is reported (more than 0, at most 1) and the frequency of the mains (50 or 60)
capture_black_mean = 4
capture_frozen_frames = 5
capture_flicker_max = 0.02
capture_powerline_hz = 50

# capture: the frames that are thrown away after a change of light, exposure or position besides the ones taken before it (0 to 100), and the most frames that are asked while waiting (1 to 1000, more than the frames thrown away)
capture_settle_frames = 3
capture_grab_tries = 30

# calib: the board of calibration (3 to 20 squares each way, the side of a square in millimetres from 1 to 100, the seed that makes the markers), the fewest corners the fit is made from (4 to 400), what the fit may leave at the corners in pixels (more than 0, at most 20), how far apart the three methods may put the corners as a share of a square (more than 0, at most 1), the distance in millimetres that was measured with a ruler between the two outer corners of a row (0: not measured), how far the calibration may be from it in millimetres, and whether a calibration that was not measured may be used
calib_squares_x = 8
calib_squares_y = 6
calib_square_mm = 5
calib_marker_seed = 1
calib_min_corners = 12
calib_max_residual_px = 0.5
calib_max_method_gap = 0.02
calib_check_mm = 0
calib_check_tol_mm = 0.05
calib_allow_unchecked = no

# camera: where the middle of the picture is in the frame of the machine, in millimetres (up to 1000 either way), and how the camera is turned, in degrees (up to 360 either way). This is the only offset that is ever added to a position from the camera
camera_offset_x_mm = 0
camera_offset_y_mm = 0
camera_offset_deg = 0

# align: looking, moving and looking again to put a board where its design says. The board is in place when it is off by no more than the tolerances (millimetres up to 5, degrees up to 5); one move shifts at most the step in millimetres (up to 50) and turns at most the step in degrees (up to 45); all the moves together shift at most the total in millimetres (up to 500); at most this many moves (1 to 50); and each move asks for this share of the correction (0.1 to 1)
align_tolerance_mm = 0.05
align_tolerance_deg = 0.1
align_max_step_mm = 2
align_max_step_deg = 2
align_max_total_mm = 10
align_max_steps = 6
align_gain = 1
